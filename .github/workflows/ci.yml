name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Cheapest, fastest signal first.
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Tests (real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Without this the tests that need a database skip themselves; here they run against the service above.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  mutation:
    name: Critical rules are guarded (mutation check)
    runs-on: ubuntu-latest
    needs: [quality, test]
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/mutation-check.mjs

  docker:
    name: Image builds & boots
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: parley-b2b-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image refuses to start without its secrets, and says why
        run: |
          if docker run --rm parley-b2b-hub:ci; then echo "started with no configuration"; exit 1; fi

  e2e:
    name: Browser tests (lab, accessibility)
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      # Same command a reviewer runs locally: builds both services with the lab on and drives them with Playwright.
      - name: make e2e
        run: make e2e
        env:
          CI: "true"
      - name: Keep the Playwright report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/test-results
          if-no-files-found: ignore
      - name: Service logs on failure
        if: failure()
        run: docker compose logs origin partner

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The binary, pinned and checksum-verified, instead of gitleaks-action: the action scans "<first commit>^..HEAD",
      # and the first commit of a new repository has no parent, so it fails on the very first push.
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          v=8.24.3
          base=https://github.com/gitleaks/gitleaks/releases/download/v$v
          curl -sSfL -o gitleaks.tgz "$base/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "$base/gitleaks_${v}_checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar xzf gitleaks.tgz gitleaks
      - name: Scan the whole history
        run: ./gitleaks git --no-banner --redact -v .
